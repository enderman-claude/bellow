name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test checker
        run: python -m unittest discover -s tests -t .
      - name: Check example
        run: python -m bellow check examples/main.exe

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test checker
        run: python -m unittest discover -s tests -t .
      - name: Check example
        run: python -m bellow check examples/main.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test checker
        run: python -m unittest discover -s tests -t .
      - name: Check example
        run: python -m bellow check examples/main.exe
