name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        shell: bash
        run: |
          python3 -c "import tomllib,sys; d=tomllib.load(open('bellow.toml','rb')); assert 'files' in d, 'no [files] table'; print('manifest ok:', d['files'])"
