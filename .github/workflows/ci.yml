name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: python3 -c "import tomllib,glob; [print(f, tomllib.load(open(f,'rb'))) for f in glob.glob('examples/*.bellow.toml')]"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        shell: bash
        run: python -c "import tomllib,glob; [print(f, tomllib.load(open(f,'rb'))) for f in glob.glob('examples/*.bellow.toml')]"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: python3 -c "import tomllib,glob; [print(f, tomllib.load(open(f,'rb'))) for f in glob.glob('examples/*.bellow.toml')]"
